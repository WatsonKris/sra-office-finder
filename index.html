* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
}

.header {
  padding: 28px 24px 0;
  max-width: 1200px;
  margin: 0 auto;
}

.header h1 {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 700;
  font-size: 28px;
  color: var(--text);
  margin-bottom: 4px;
}

.header .subtitle {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 20px;
}

.search-area {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
  padding: 12px 24px 0;
  max-width: 1200px;
  margin: 0 auto;
}

.search-wrap {
  position: relative;
  margin-bottom: 12px;
}

.search-wrap svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: var(--text-secondary);
  pointer-events: none;
}

.search-input {
  width: 100%;
  padding: 12px 44px 12px 42px;
  font-family: inherit;
  font-size: 15px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-search);
  color: var(--text);
  box-shadow: var(--shadow-search);
  outline: none;
  transition: border-color 0.15s;
}

.search-input:focus {
  border-color: var(--accent);
}

.search-input::placeholder {
  color: var(--text-secondary);
}

.clear-btn {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 22px;
  height: 22px;
  border: none;
  background: var(--bg-tag);
  color: var(--text-secondary);
  border-radius: 50%;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  line-height: 1;
}

.clear-btn.visible { display: flex; }

/* Suggestions dropdown */
.suggestions {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: var(--bg-suggest);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-suggest);
  max-height: 320px;
  overflow-y: auto;
  display: none;
  z-index: 100;
}

.suggestions.open { display: block; }

.suggestion-label {
  padding: 8px 14px 4px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text-secondary);
  font-weight: 600;
}

.suggestion-item {
  padding: 8px 14px;
  cursor: pointer;
  font-size: 14px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background 0.1s;
}

.suggestion-item:hover, .suggestion-item.active {
  background: var(--bg-suggest-hover);
}

.suggestion-item .s-icon {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
}

.suggestion-item .s-icon.industry { background: var(--accent-soft); color: var(--accent); }
.suggestion-item .s-icon.location { background: var(--teal-soft); color: var(--teal); }
.suggestion-item .s-icon.office { background: var(--bg-tag); color: var(--text-secondary); }

.suggestion-item .s-text { flex: 1; min-width: 0; }
.suggestion-item .s-main { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.suggestion-item .s-sub { display: block; font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.suggestion-divider {
  height: 1px;
  background: var(--border);
  margin: 4px 0;
}

/* Did you mean */
.dym-bar {
  background: var(--bg-dym);
  border: 1px solid var(--accent-soft);
  border-radius: var(--radius-sm);
  padding: 8px 14px;
  margin-bottom: 10px;
  font-size: 13px;
  color: var(--text-secondary);
  display: none;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.dym-bar.visible { display: flex; }

.dym-bar strong { color: var(--text); font-weight: 600; }

.dym-link {
  color: var(--accent);
  font-weight: 600;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.dym-link:hover { opacity: 0.8; }

/* Example queries */
.examples {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.example-chip {
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px dashed var(--border);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.example-chip:hover {
  border-color: var(--accent);
  color: var(--accent);
  border-style: solid;
  background: var(--accent-soft);
}

.filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.filter-btn {
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.3px;
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--bg-filter);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.filter-btn:hover {
  border-color: var(--accent);
  color: var(--text);
}

.filter-btn.active {
  background: var(--bg-filter-active);
  color: var(--text-filter-active);
  border-color: var(--bg-filter-active);
}

.results-info {
  max-width: 1200px;
  margin: 0 auto;
  padding: 12px 24px 8px;
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}

.results-info span {
  color: var(--accent);
  font-weight: 700;
}

.results-info .parsed-query {
  font-size: 12px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.parsed-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
}

.parsed-pill.industry { background: var(--accent-soft); color: var(--accent); }
.parsed-pill.location { background: var(--teal-soft); color: var(--teal); }
.parsed-pill.role { background: var(--bg-tag); color: var(--text-tag); }

.grid {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px 40px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 10px;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow-card);
  transition: background 0.15s, box-shadow 0.15s;
  cursor: default;
  position: relative;
}

.card:hover {
  background: var(--bg-card-hover);
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 6px;
}

.card-name {
  font-weight: 600;
  font-size: 15px;
  color: var(--text);
  line-height: 1.3;
}

.card-location {
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 2px;
}

.card-contact {
  font-size: 13px;
  color: var(--teal);
  font-weight: 500;
  margin-bottom: 8px;
}

.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.tag {
  font-size: 11px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: var(--radius-tag);
  background: var(--bg-tag);
  color: var(--text-tag);
  white-space: nowrap;
}

.tag.highlight {
  background: var(--bg-tag-highlight);
  color: var(--accent);
  font-weight: 600;
}

.tag.matched {
  background: var(--match-bg);
  color: var(--match-text);
  font-weight: 600;
}

.match-score {
  position: absolute;
  top: 10px;
  right: 12px;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 10px;
  letter-spacing: 0.3px;
}

.match-score.high { background: rgba(46,125,111,0.12); color: var(--score-high); }
.match-score.med { background: var(--accent-soft); color: var(--score-med); }
.match-score.low { background: var(--bg-tag); color: var(--score-low); }

.no-results {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text-secondary);
  font-size: 15px;
}

.no-results strong {
  display: block;
  font-size: 17px;
  color: var(--text);
  margin-bottom: 6px;
}

.no-results .try-links {
  margin-top: 12px;
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}

@media (max-width: 720px) {
  .grid {
    grid-template-columns: 1fr;
  }
  .header h1 {
    font-size: 22px;
  }
  .examples { display: none; }
}
</style>

// ============================================================
// FUZZY MATCHING (Levenshtein distance)
// ============================================================
function levenshtein(a, b) {
  if (a.length === 0) return b.length;
  if (b.length === 0) return a.length;
  const matrix = [];
  for (let i = 0; i <= b.length; i++) matrix[i] = [i];
  for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      if (b[i-1] === a[j-1]) matrix[i][j] = matrix[i-1][j-1];
      else matrix[i][j] = Math.min(matrix[i-1][j-1]+1, matrix[i][j-1]+1, matrix[i-1][j]+1);
    }
  }
  return matrix[b.length][a.length];
}

function fuzzyMatch(needle, haystack, threshold) {
  needle = needle.toLowerCase();
  haystack = haystack.toLowerCase();
  if (haystack.includes(needle)) return { match: true, distance: 0, exact: true };
  // Check each word in haystack
  const words = haystack.split(/[\s,\/&]+/);
  let bestDist = Infinity;
  for (const word of words) {
    if (word.length < 2) continue;
    const dist = levenshtein(needle, word);
    const maxLen = Math.max(needle.length, word.length);
    if (dist <= threshold && dist < bestDist) bestDist = dist;
    // Also check if needle is a prefix
    if (word.startsWith(needle) || needle.startsWith(word)) {
      bestDist = Math.min(bestDist, 1);
    }
  }
  return { match: bestDist <= threshold, distance: bestDist, exact: false };
}

// ============================================================
// NATURAL LANGUAGE QUERY PARSER
// ============================================================
const NOISE_WORDS = new Set(['who','what','which','where','is','the','best','for','a','an','in','on','at','of',
  'does','do','that','this','are','can','has','have','with','and','or','to','from',
  'focuses','focus','specializes','specialize','specialist','specialists',
  'recruiter','recruiters','recruiting','offices','office','firm','firms',
  'search','find','looking','need','want','good','great','top']);

function parseQuery(raw) {
  // Strip question marks and common filler
  let q = raw.toLowerCase().replace(/[?!.]/g, '').trim();

  const parsed = { industries: [], locations: [], roles: [], rawTerms: [], original: raw };

  // Extract region / location phrases first
  for (const [region, states] of Object.entries(REGIONS)) {
    const re = new RegExp('\\b' + region.replace(/\s+/g, '\\s+') + '\\b', 'i');
    if (re.test(q)) {
      parsed.locations.push({ name: region, states });
      q = q.replace(re, ' ');
    }
  }

  // Extract state names
  for (const [state, abbr] of Object.entries(STATE_ABBRS)) {
    const re = new RegExp('\\b' + state.replace(/\s+/g, '\\s+') + '\\b', 'i');
    if (re.test(q)) {
      parsed.locations.push({ name: state, states: [abbr] });
      q = q.replace(re, ' ');
    }
  }

  // Check for 2-letter state abbreviations
  const abbrMatch = q.match(/\b([A-Z]{2})\b/i);
  if (abbrMatch) {
    const abbr = abbrMatch[1].toUpperCase();
    const validAbbrs = new Set(Object.values(STATE_ABBRS));
    if (validAbbrs.has(abbr)) {
      parsed.locations.push({ name: abbr, states: [abbr] });
      q = q.replace(new RegExp('\\b' + abbrMatch[1] + '\\b', 'i'), ' ');
    }
  }

  // Extract known synonym keys (multi-word first)
  const synKeys = Object.keys(SYNONYMS).sort((a, b) => b.length - a.length);
  for (const key of synKeys) {
    const re = new RegExp('\\b' + key.replace(/[+\/]/g, '\\$&').replace(/\s+/g, '\\s+') + '\\b', 'i');
    if (re.test(q)) {
      parsed.industries.push(key);
      q = q.replace(re, ' ');
    }
  }

  // Remaining meaningful words
  const remaining = q.split(/\s+/).filter(w => w.length > 1 && !NOISE_WORDS.has(w));
  parsed.rawTerms = remaining;

  return parsed;
}

// ============================================================
// SCORING ENGINE
// ============================================================
function scoreOffice(office, parsed) {
  let score = 0;
  const matchedTags = new Set();
  const haystack = [office.name, office.location, office.contact, ...office.tags].join(' ').toLowerCase();

  // Industry matching via synonyms
  for (const industry of parsed.industries) {
    const expansions = SYNONYMS[industry] || [industry];
    for (const exp of expansions) {
      for (const tag of office.tags) {
        if (tag.toLowerCase().includes(exp.toLowerCase()) || exp.toLowerCase().includes(tag.toLowerCase())) {
          score += 20;
          matchedTags.add(tag);
        }
      }
    }
    // Also direct match in haystack
    if (haystack.includes(industry)) {
      score += 15;
    }
  }

  // Location matching
  for (const loc of parsed.locations) {
    if (!office.location) continue;
    const officeLoc = office.location.toUpperCase();
    for (const st of loc.states) {
      if (officeLoc.includes(st) || officeLoc.includes(', ' + st)) {
        score += 25;
        break;
      }
    }
  }

  // Raw term matching (fuzzy)
  for (const term of parsed.rawTerms) {
    // Exact substring
    if (haystack.includes(term)) {
      score += 10;
      // Find which tag matched
      for (const tag of office.tags) {
        if (tag.toLowerCase().includes(term)) matchedTags.add(tag);
      }
    } else {
      // Fuzzy match
      const threshold = term.length <= 4 ? 1 : 2;
      const result = fuzzyMatch(term, haystack, threshold);
      if (result.match) {
        score += Math.max(1, 6 - result.distance * 2);
        for (const tag of office.tags) {
          const tagResult = fuzzyMatch(term, tag, threshold);
          if (tagResult.match) matchedTags.add(tag);
        }
      }
    }
  }

  // Bonus for offices with more detail (location, contact, multiple tags)
  if (office.location) score += 1;
  if (office.contact) score += 1;
  if (office.tags.length > 2) score += 1;

  return { score, matchedTags: [...matchedTags] };
}

// "DID YOU MEAN?" SUGGESTIONS
// ============================================================
function getDidYouMean(rawTerms) {
  const suggestions = [];
  const allTags = new Set();
  OFFICES.forEach(o => o.tags.forEach(t => allTags.add(t.toLowerCase())));
  const tagList = [...allTags];

  for (const term of rawTerms) {
    if (term.length < 3) continue;
    // Check if it's close to a known synonym key
    for (const key of Object.keys(SYNONYMS)) {
      const dist = levenshtein(term, key);
      if (dist > 0 && dist <= 2 && dist < term.length * 0.4) {
        suggestions.push({ from: term, to: key, distance: dist });
      }
    }
    // Check if it's close to a tag
    for (const tag of tagList) {
      const dist = levenshtein(term, tag);
      if (dist > 0 && dist <= 2 && dist < term.length * 0.35) {
        suggestions.push({ from: term, to: tag, distance: dist });
      }
    }
  }

  // Deduplicate, keep best
  const best = {};
  for (const s of suggestions) {
    if (!best[s.from] || s.distance < best[s.from].distance) {
      best[s.from] = s;
    }
  }
  return Object.values(best);
}

// ============================================================
// AUTOCOMPLETE SUGGESTIONS
// ============================================================
function getSuggestions(partial) {
  if (!partial || partial.length < 2) return [];
  const p = partial.toLowerCase();
  const results = [];

  // Industry / synonym matches
  for (const key of Object.keys(SYNONYMS)) {
    if (key.includes(p) || p.includes(key)) {
      results.push({ type: 'industry', text: key, sub: SYNONYMS[key].slice(0, 3).join(', ') });
    }
  }

  // Tag matches
  const allTags = new Set();
  OFFICES.forEach(o => o.tags.forEach(t => allTags.add(t)));
  for (const tag of allTags) {
    if (tag.toLowerCase().includes(p) && !results.some(r => r.text.toLowerCase() === tag.toLowerCase())) {
      const count = OFFICES.filter(o => o.tags.includes(tag)).length;
      if (tag !== 'Executive Search' && tag !== 'Recruiting' && tag !== 'Staffing') {
        results.push({ type: 'industry', text: tag, sub: `${count} office${count > 1 ? 's' : ''}` });
      }
    }
  }

  // Location matches
  for (const region of Object.keys(REGIONS)) {
    if (region.includes(p)) {
      results.push({ type: 'location', text: region, sub: `${REGIONS[region].length} states` });
    }
  }

  // Office name matches
  for (const o of OFFICES) {
    if (o.name.toLowerCase().includes(p)) {
      results.push({ type: 'office', text: o.name, sub: o.location || '' });
    }
  }

  // Limit
  return results.slice(0, 8);
}

// ============================================================
// CATEGORY FILTERS
// ============================================================
const CATEGORIES = [
  {label:"All", filter: null},
  {label:"Tech & Cyber", filter: o => o.tags.some(t => /technology|information technology|it|cyber|software|ai|artificial intelligence|saas|blockchain|web3|data|robotics|automation|pega|sap|enterprise|emerging/i.test(t))},
  {label:"Healthcare & Life Science", filter: o => o.tags.some(t => /health|medical|life science|biotech|diagnostic|physician|clinical|anesthes|cardio|neuro|vascular|nursing|hospice|pharma/i.test(t))},
  {label:"Finance & Banking", filter: o => o.tags.some(t => /financ|banking|accounting|cpa|wealth|investment|hedge|private equity|venture capital|family office|tax|actuarial|portfolio/i.test(t))},
  {label:"Engineering & Manufacturing", filter: o => o.tags.some(t => /engineer|manufactur|industrial|supply chain|operations|automation|aerospace|cnc|welding|fabricat/i.test(t))},
  {label:"Construction & Building", filter: o => o.tags.some(t => /construct|building|architecture|hvac|plumbing|roofing|landscape|home improvement/i.test(t))},
  {label:"Energy & Utilities", filter: o => o.tags.some(t => /energy|oil|gas|power|renewable|cleantech|ev|microgrid|nuclear|utilities|electrical power/i.test(t))},
  {label:"Legal", filter: o => o.tags.some(t => /legal|attorney|law/i.test(t))},
  {label:"Sales & Marketing", filter: o => o.tags.some(t => /sales|marketing|digital marketing|investor relation|communications/i.test(t))},
  {label:"Food & Agriculture", filter: o => o.tags.some(t => /food|beverage|agri|grain|animal|catering|restaurant/i.test(t))}
];

// Priority keywords for Kris's verticals
const PRIORITY_KEYWORDS = ['cybersecurity','cyber security','iot','internet of things','fintech','financial technology','embedded','connectivity','edge','ai','artificial intelligence','saas','software','blockchain','web3','data','robotics','automation','technology','emerging technology'];

// Example queries
const EXAMPLE_QUERIES = [
  'who does fintech?',
  'construction GCs',
  'biotech sales East Coast',
  'cybersecurity',
  'medical device midwest',
  'oil & gas Texas',
  'AI and robotics',
  'legal northeast'
];

// ============================================================
// STATE
// ============================================================
let activeFilter = null;
let suggestIndex = -1;

// ============================================================
// RENDER
// ============================================================
function isPriority(tag) {
  const t = tag.toLowerCase();
  return PRIORITY_KEYWORDS.some(k => t.includes(k));
}

function render() {
  const raw = document.getElementById('searchInput').value.trim();
  const clearBtn = document.getElementById('clearBtn');
  clearBtn.classList.toggle('visible', raw.length > 0);

  // Close suggestions on render
  document.getElementById('suggestions').classList.remove('open');

  const parsed = parseQuery(raw);
  const hasQuery = raw.length > 0;

  let results;
  if (!hasQuery) {
    results = OFFICES.map(o => ({ office: o, score: 0, matchedTags: [] }));
  } else {
    results = OFFICES.map(o => {
      const { score, matchedTags } = scoreOffice(o, parsed);
      return { office: o, score, matchedTags };
    }).filter(r => r.score > 0);
  }

  // Apply category filter
  if (activeFilter) {
    const cat = CATEGORIES.find(c => c.label === activeFilter);
    if (cat && cat.filter) results = results.filter(r => cat.filter(r.office));
  }

  // Sort by score (desc), then detail, then alpha
  results.sort((a, b) => {
    if (b.score !== a.score) return b.score - a.score;
    const aDetail = (a.office.location ? 1 : 0) + (a.office.contact ? 1 : 0) + (a.office.tags.length > 1 ? 1 : 0);
    const bDetail = (b.office.location ? 1 : 0) + (b.office.contact ? 1 : 0) + (b.office.tags.length > 1 ? 1 : 0);
    if (bDetail !== aDetail) return bDetail - aDetail;
    return a.office.name.localeCompare(b.office.name);
  });

  // Did you mean?
  const dymBar = document.getElementById('dymBar');
  if (hasQuery && results.length < 5 && parsed.rawTerms.length > 0) {
    const dyms = getDidYouMean(parsed.rawTerms);
    if (dyms.length > 0) {
      dymBar.innerHTML = 'Did you mean: ' + dyms.map(d =>
        `<span class="dym-link" onclick="applyDym('${d.to.replace(/'/g, "\\'")}')">${d.to}</span>`
      ).join(', ') + '?';
      dymBar.classList.add('visible');
    } else {
      dymBar.classList.remove('visible');
    }
  } else {
    dymBar.classList.remove('visible');
  }

  // Parsed query pills
  let parsedHtml = '';
  if (hasQuery && (parsed.industries.length || parsed.locations.length)) {
    const pills = [];
    for (const ind of parsed.industries) pills.push(`<span class="parsed-pill industry">${ind}</span>`);
    for (const loc of parsed.locations) pills.push(`<span class="parsed-pill location">${loc.name}</span>`);
    parsedHtml = `<div class="parsed-query">${pills.join('')}</div>`;
  }

  // Results info
  const maxScore = results.length > 0 ? results[0].score : 0;
  document.getElementById('resultsInfo').innerHTML =
    `<div>Showing <span>${results.length}</span> of ${OFFICES.length} offices` +
    (hasQuery ? ` matching "${raw}"` : '') +
    (activeFilter && activeFilter !== 'All' ? ` in ${activeFilter}` : '') +
    `</div>${parsedHtml}`;

  // Examples (show when no query)
  const examplesEl = document.getElementById('examples');
  if (!hasQuery) {
    examplesEl.innerHTML = '<span style="font-size:11px;color:var(--text-secondary);font-weight:500;margin-right:4px;">Try:</span>' +
      EXAMPLE_QUERIES.map(q => `<button class="example-chip" onclick="tryExample('${q.replace(/'/g, "\\'")}')">${q}</button>`).join('');
    examplesEl.style.display = '';
  } else {
    examplesEl.style.display = 'none';
  }

  // Grid
  const grid = document.getElementById('grid');
  if (results.length === 0) {
    const suggestions = EXAMPLE_QUERIES.slice(0, 4).map(q =>
      `<button class="example-chip" onclick="tryExample('${q.replace(/'/g, "\\'")}')">${q}</button>`
    ).join('');
    grid.innerHTML = `<div class="no-results">
      <strong>No offices match "${raw}"</strong>
      Try a different term, or use natural language like the examples below.
      <div class="try-links">${suggestions}</div>
    </div>`;
    return;
  }

  grid.innerHTML = results.map(r => {
    const o = r.office;
    const tagsHtml = o.tags.map(t => {
      let cls = 'tag';
      if (r.matchedTags.includes(t)) cls += ' matched';
      else if (isPriority(t)) cls += ' highlight';
      return `<span class="${cls}">${t}</span>`;
    }).join('');

    // Match score badge
    let scoreBadge = '';
    if (hasQuery && r.score > 0) {
      const pct = maxScore > 0 ? Math.round((r.score / maxScore) * 100) : 0;
      const level = pct >= 70 ? 'high' : pct >= 40 ? 'med' : 'low';
      scoreBadge = `<span class="match-score ${level}">${pct}%</span>`;
    }

    return `<div class="card">
      ${scoreBadge}
      <div class="card-top">
        <div class="card-name">${o.name}</div>
        ${o.location ? `<div class="card-location">${o.location}</div>` : ''}
      </div>
      ${o.contact ? `<div class="card-contact">${o.contact}</div>` : ''}
      <div class="card-tags">${tagsHtml}</div>
    </div>`;
  }).join('');
}

// ============================================================
// AUTOCOMPLETE UI
// ============================================================
function showSuggestions() {
  const input = document.getElementById('searchInput');
  const val = input.value.trim();
  const suggestions = getSuggestions(val);
  const el = document.getElementById('suggestions');

  if (suggestions.length === 0) {
    el.classList.remove('open');
    return;
  }

  const icons = { industry: '🏢', location: '📍', office: '🔍' };
  let html = '';
  let lastType = '';
  suggestions.forEach((s, i) => {
    if (s.type !== lastType) {
      const labels = { industry: 'Industries & Specialties', location: 'Regions', office: 'Offices' };
      if (lastType) html += '<div class="suggestion-divider"></div>';
      html += `<div class="suggestion-label">${labels[s.type] || s.type}</div>`;
      lastType = s.type;
    }
    html += `<div class="suggestion-item" data-idx="${i}" data-text="${s.text.replace(/"/g, '&quot;')}" onclick="pickSuggestion(this)">
      <div class="s-icon ${s.type}">${icons[s.type]}</div>
      <div class="s-text">
        <span class="s-main">${s.text}</span>
        ${s.sub ? `<span class="s-sub">${s.sub}</span>` : ''}
      </div>
    </div>`;
  });

  el.innerHTML = html;
  el.classList.add('open');
  suggestIndex = -1;
}

function pickSuggestion(el) {
  const text = el.dataset.text;
  document.getElementById('searchInput').value = text;
  document.getElementById('suggestions').classList.remove('open');
  render();
}

function tryExample(q) {
  document.getElementById('searchInput').value = q;
  render();
  document.getElementById('searchInput').focus();
}

function applyDym(term) {
  const input = document.getElementById('searchInput');
  input.value = term;
  render();
  input.focus();
}

// ============================================================
// FILTERS
// ============================================================
function buildFilters() {
  const container = document.getElementById('filters');
  container.innerHTML = CATEGORIES.map(c =>
    `<button class="filter-btn${c.label === 'All' ? ' active' : ''}" data-filter="${c.label}">${c.label}</button>`
  ).join('');

  container.addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter === 'All' ? null : btn.dataset.filter;
    render();
  });
}

// ============================================================
// EVENT LISTENERS
// ============================================================
const searchInput = document.getElementById('searchInput');
let debounceTimer;

searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    render();
    showSuggestions();
  }, 150);
});

searchInput.addEventListener('focus', () => {
  if (searchInput.value.trim().length >= 2) showSuggestions();
});

searchInput.addEventListener('keydown', e => {
  const sugEl = document.getElementById('suggestions');
  const items = sugEl.querySelectorAll('.suggestion-item');
  if (!sugEl.classList.contains('open') || items.length === 0) {
    if (e.key === 'Enter') { e.preventDefault(); render(); }
    return;
  }

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    suggestIndex = Math.min(suggestIndex + 1, items.length - 1);
    items.forEach((it, i) => it.classList.toggle('active', i === suggestIndex));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    suggestIndex = Math.max(suggestIndex - 1, -1);
    items.forEach((it, i) => it.classList.toggle('active', i === suggestIndex));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (suggestIndex >= 0 && items[suggestIndex]) {
      pickSuggestion(items[suggestIndex]);
    } else {
      sugEl.classList.remove('open');
      render();
    }
  } else if (e.key === 'Escape') {
    sugEl.classList.remove('open');
  }
});

document.getElementById('clearBtn').addEventListener('click', () => {
  searchInput.value = '';
  render();
  searchInput.focus();
});

// Close suggestions on outside click
document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) {
    document.getElementById('suggestions').classList.remove('open');
  }
});

// ============================================================
// INIT
// ============================================================
buildFilters();
render();
</script>
